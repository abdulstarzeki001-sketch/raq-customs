name: Publish recovered frontend to Cloudflare Pages
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || 'd2680f7c5ff39f8d9177a51dbf7fec75' }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test recovered frontend
        run: node --test tests/*.test.mjs
      - name: Build and verify static deploy files
        run: |
          mkdir -p site
          cp index.html form.html document.html traders.html _headers robots.txt site/
          cp -R css data images js site/
          node scripts/verify-deploy.mjs site
      - name: Require Cloudflare API token
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Cannot publish without CLOUDFLARE_API_TOKEN GitHub Actions secret."
            exit 1
          fi
      - name: Deploy static site
        run: npx --yes wrangler@4 pages deploy site --project-name iraq-customs --branch main
      - name: Check live site
        run: |
          for path in / /form.html /traders.html /document.html; do
            curl --fail --silent --show-error --location --retry 3 --retry-delay 4 "https://iraq-customs.pages.dev$path" >/dev/null
          done
