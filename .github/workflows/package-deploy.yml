name: Package and Deploy Cloudflare Pages
on:
  push:
    branches: [main, restore-original-pages]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate legacy pages
        run: node --test tests/*.test.mjs
      - name: Build static deploy directory
        run: |
          mkdir -p site
          cp index.html form.html document.html traders.html _headers robots.txt site/
          cp -R css data images js site/
          test -s site/index.html
          test -s site/form.html
          test -s site/document.html
          test -s site/traders.html
          test -s site/data/companies.json
      - uses: actions/upload-artifact@v4
        with:
          name: iraq-customs-pages-files
          path: site/
          if-no-files-found: error
          retention-days: 14
      - name: Check Cloudflare credentials
        id: cloudflare
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CF_TOKEN" ] && [ -n "$CF_ACCOUNT" ] && [ "${{ github.ref_name }}" = 'main' ]; then
            echo "can_deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "can_deploy=false" >> "$GITHUB_OUTPUT"
            echo "Cloudflare deploy skipped (missing secrets or preview branch)."
          fi
      - name: Deploy to existing Cloudflare Pages project
        if: steps.cloudflare.outputs.can_deploy == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 pages deploy site --project-name iraq-customs --branch main
