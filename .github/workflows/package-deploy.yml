name: Package and Deploy Cloudflare Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || 'd2680f7c5ff39f8d9177a51dbf7fec75' }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test recovered frontend
        run: node --test tests/*.test.mjs
      - name: Build and verify static deploy files
        run: |
          mkdir -p site
          cp index.html form.html document.html traders.html _headers robots.txt site/
          cp -R css data images js site/
          node scripts/verify-deploy.mjs site
      - name: Upload verified package
        uses: actions/upload-artifact@v4
        with:
          name: iraq-customs-pages-files
          path: site/
          if-no-files-found: error
          retention-days: 14
      - name: Check Cloudflare publishing access
        id: access
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::NOT DEPLOYED: Add GitHub secret CLOUDFLARE_API_TOKEN to enable publishing."
            echo "## Cloudflare: not deployed (missing API token)" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Publish to existing Cloudflare Pages project
        if: steps.access.outputs.available == 'true'
        run: npx --yes wrangler@4 pages deploy site --project-name iraq-customs --branch main
      - name: Verify Cloudflare routes
        if: steps.access.outputs.available == 'true'
        run: |
          for path in / /form.html /traders.html /document.html; do
            curl --fail --silent --show-error --location --retry 3 --retry-delay 4 "https://iraq-customs.pages.dev$path" >/dev/null
          done
          echo "## Cloudflare: deployed and routes responding" >> "$GITHUB_STEP_SUMMARY"
